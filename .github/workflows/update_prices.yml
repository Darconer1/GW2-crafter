name: Update GW2 Prices Every 8 Hours

on:
  schedule:
    # Alle 8 Stunden: 0:00, 8:00, 16:00 UTC
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:  # Manuell triggerbar

jobs:
  update-prices:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Price Update Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_prices.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add price_history.json price_history.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 Auto-Update: Preise aktualisiert - $(date +'%Y-%m-%d %H:%M UTC')" && git push)
